services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quakewatch
      POSTGRES_USER: quakewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U quakewatch -d quakewatch']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment: &backend_env
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in your environment}
      DATABASE_URL: postgresql://quakewatch:${POSTGRES_PASSWORD}@database:5432/quakewatch?serverVersion=16
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://localhost(:[0-9]+)?$}
      LOCK_DSN: flock:///app/var/locks
    depends_on:
      database: {condition: service_healthy}
    # Only locks are shared; the compiled Symfony cache must not outlive the image.
    volumes: [backend_locks:/app/var/locks]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
        VITE_TILE_ATTRIBUTION: ${VITE_TILE_ATTRIBUTION:-&copy; OpenStreetMap contributors}
    ports: ['8080:80']
    depends_on: [backend]
  importer:
    build: ./backend
    environment: *backend_env
    depends_on:
      database: {condition: service_healthy}
    # Only locks are shared; the compiled Symfony cache must not outlive the image.
    volumes: [backend_locks:/app/var/locks]
    # Each cycle is a new PHP process; failed cycles retry without retaining ORM state.
    command: [sh, -c, 'while true; do php bin/console app:import-earthquakes --no-interaction; sleep 300; done']
    restart: unless-stopped
volumes:
  postgres_data:
  backend_locks:
